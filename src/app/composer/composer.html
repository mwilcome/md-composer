<div class="composer" [class.mobile-preview]="mobilePane() === 'preview'">
  <header class="chrome">
    <p class="brand" [attr.title]="appTitle">
      <span class="mark">md</span>
      <span class="brand-name">Composer</span>
    </p>
    <div class="pane-switch" role="tablist" aria-label="View">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mobilePane() === 'write'"
        [class.active]="mobilePane() === 'write'"
        (click)="showWrite()"
      >
        Write
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mobilePane() === 'preview'"
        [class.active]="mobilePane() === 'preview'"
        (click)="showPreview()"
      >
        Preview
      </button>
    </div>
    @if (mobilePane() === 'write' || wide()) {
      <nav class="format" aria-label="Markdown">
        @for (group of commandGroups; track group.name) {
          <div class="group" role="group" [attr.aria-label]="group.name">
            @for (command of group.commands; track command.id) {
              <button
                type="button"
                class="icon-btn"
                [class.active]="activeBlock() === command.id"
                [attr.data-cmd]="command.id"
                [attr.aria-pressed]="activeBlock() === command.id"
                [attr.title]="command.hint ?? command.label"
                [attr.aria-label]="command.hint ?? command.label"
                (mousedown)="applyMarkup(command, $event)"
              >
                <app-md-icon [name]="command.id" />
              </button>
            }
          </div>
        }
      </nav>
    }
    <div class="actions" role="group" aria-label="Document">
      <button type="button" title="Undo (Ctrl+Z)" (mousedown)="keepSourceFocus($event)" (click)="undo()">
        <app-md-icon name="undo" />
        <span class="btn-label">Undo</span>
      </button>
      <button type="button" title="Redo (Ctrl+Y)" (mousedown)="keepSourceFocus($event)" (click)="redo()">
        <app-md-icon name="redo" />
        <span class="btn-label">Redo</span>
      </button>
      <span class="rule" aria-hidden="true"></span>
      <button type="button" title="Copy markdown" (click)="copyMarkdown()">
        <app-md-icon name="copy" />
        <span class="btn-label">
          @switch (copyState()) {
            @case ('copied') {
              Copied
            }
            @case ('failed') {
              Failed
            }
            @default {
              Copy
            }
          }
        </span>
      </button>
      <button
        type="button"
        class="desktop-preview"
        title="Toggle preview"
        [attr.aria-pressed]="previewOpen()"
        (click)="togglePreview()"
      >
        <app-md-icon name="preview" />
        <span class="btn-label">Preview</span>
      </button>
    </div>
  </header>

  <div class="panes" [class.preview-open]="previewOpen()">
    <section class="source">
      <textarea
        #field
        spellcheck="false"
        placeholder="Write markdown…"
        (input)="onSourceInput($event)"
        (keyup)="onSourceInput($event)"
        (click)="onSourceInput($event)"
        (keydown)="onSourceKeydown($event)"
      ></textarea>
    </section>
    @if (previewOpen() || !wide()) {
      <section class="preview" aria-label="Preview">
        @if (draft().body.trim()) {
          <div class="rendered" [innerHTML]="html()" (click)="onPreviewClick($event)"></div>
        } @else {
          <p class="empty">Preview appears here.</p>
        }
      </section>
    }
  </div>
</div>

<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
  @switch (name()) {
    @case ('h1') {
      <text x="1" y="12" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="currentColor">H1</text>
    }
    @case ('h2') {
      <text x="1" y="12" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="currentColor">H2</text>
    }
    @case ('h3') {
      <text x="1" y="12" font-size="11" font-weight="700" font-family="system-ui, sans-serif" fill="currentColor">H3</text>
    }
    @case ('h4') {
      <text x="1" y="12" font-size="10" font-weight="650" font-family="system-ui, sans-serif" fill="currentColor">H4</text>
    }
    @case ('h5') {
      <text x="1" y="12" font-size="10" font-weight="650" font-family="system-ui, sans-serif" fill="currentColor">H5</text>
    }
    @case ('h6') {
      <text x="1" y="12" font-size="10" font-weight="650" font-family="system-ui, sans-serif" fill="currentColor">H6</text>
    }
    @case ('hr') {
      <path d="M2 8h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    }
    @case ('bold') {
      <path
        d="M4 3h5.2a2.6 2.6 0 0 1 0 5.2H4zm0 5.2h5.8A2.7 2.7 0 0 1 9.8 13.5H4z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    }
    @case ('italic') {
      <path d="M7 3h6M4 13h6M9.5 3 6.5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    }
    @case ('bold-italic') {
      <path d="M4 13 8 3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <path d="M6.2 8.2h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    }
    @case ('strike') {
      <path d="M3 8h10M5.5 5.2C6 4 7.2 3.3 8.6 3.3c1.8 0 3 1 3 2.4 0 .7-.3 1.3-.9 1.8M5.4 8.6c-.5.6-.7 1.2-.7 2 0 1.7 1.5 3 3.5 3 1.5 0 2.7-.6 3.3-1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    }
    @case ('code') {
      <path d="M6 4 2.8 8 6 12M10 4l3.2 4L10 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('ul') {
      <path d="M6 4h8M6 8h8M6 12h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="3.2" cy="4" r="1" fill="currentColor" />
      <circle cx="3.2" cy="8" r="1" fill="currentColor" />
      <circle cx="3.2" cy="12" r="1" fill="currentColor" />
    }
    @case ('ol') {
      <path d="M7 4h7M7 8h7M7 12h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M3 2.8v3.2M2.3 6h1.8M2.3 9.2h2.1L2.4 12.2h2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('task') {
      <rect x="2" y="3" width="4" height="4" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.4" />
      <path d="M3 5.1 4.1 6.2 6.2 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
      <path d="M8 5h6M2 11h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    }
    @case ('quote') {
      <path d="M3 5h10v7H6l-3 3V5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
    }
    @case ('fence') {
      <path d="M5 3 2 8l3 5M11 3l3 5-3 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('link') {
      <path d="M7 9.2a3 3 0 0 0 4.3.2l1.6-1.6a3 3 0 0 0-4.2-4.2L7.8 4.5M9 6.8a3 3 0 0 0-4.3-.2L3.1 8.2a3 3 0 0 0 4.2 4.2l.9-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    }
    @case ('image') {
      <rect x="2" y="3" width="12" height="10" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5" />
      <circle cx="6" cy="7" r="1.1" fill="currentColor" />
      <path d="M2 11.2 6.2 8.4l3 2.4 2.1-1.6L14 11.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    }
    @case ('table') {
      <rect x="2" y="3" width="12" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M2 6.5h12M2 10h12M6.5 3v10M10 3v10" fill="none" stroke="currentColor" stroke-width="1.3" />
    }
    @case ('details') {
      <path d="M3 4h10M3 8h7M3 12h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M11.2 10.2 13 12l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('comment') {
      <path d="M3 3.5h10v7.5H7.5L4 13.5V11H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
    }
    @case ('br') {
      <path d="M3 4h10M3 8h6.5a3 3 0 0 1 0 6H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M8.2 12.2 7 14l-1.2-1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('undo') {
      <path d="M4 7.5H11a3 3 0 1 1 0 6H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M4 7.5 6.4 5M4 7.5 6.4 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('redo') {
      <path d="M12 7.5H5a3 3 0 1 0 0 6h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M12 7.5 9.6 5M12 7.5 9.6 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('copy') {
      <rect x="5.5" y="5.5" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M10.5 5.5V4.2A1.2 1.2 0 0 0 9.3 3H3.7A1.2 1.2 0 0 0 2.5 4.2v5.6A1.2 1.2 0 0 0 3.7 11h1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
    }
    @case ('preview') {
      <path d="M2.5 8s2.2-4 5.5-4 5.5 4 5.5 4-2.2 4-5.5 4-5.5-4-5.5-4z" fill="none" stroke="currentColor" stroke-width="1.5" />
      <circle cx="8" cy="8" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4" />
    }
    @case ('download') {
      <path d="M8 3v7M5.2 7.5 8 10.4l2.8-2.9M3.5 13h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('highlight') {
      <path d="M4 12.5h8M6.2 10.8 11.5 5.5a1.4 1.4 0 0 0 0-2L10.5 2.5a1.4 1.4 0 0 0-2 0L3.2 7.8 2.5 12.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    }
    @case ('alert') {
      <path d="M8 2.8 14.2 13.5H1.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M8 6.4v3.4M8 11.6h.01" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    }
    @case ('footnote') {
      <path d="M4 3h6l3 3v7H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M10 3v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      <text x="6.2" y="12.2" font-size="6.5" font-weight="700" font-family="system-ui, sans-serif" fill="currentColor">1</text>
    }
    @default {
      <circle cx="8" cy="8" r="2" fill="currentColor" />
    }
  }
</svg>
